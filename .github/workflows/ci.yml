name: ci
on: [push, pull_request]
jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which has no 3.9 build in
    # actions/python-versions. 24.04 carries every version in the matrix.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install pytest
      - run: pytest -q
